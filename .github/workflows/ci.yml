# GitHub Actions CI workflow for xalgorix.
#
# Every pull request runs `make lint`, the unit-test suite, and `go vet`.
# This file stays focused on the per-PR fast feedback loop.

name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - "release/**"
  push:
    branches:
      - main
      - master
  # Allows re-running CI on demand. Needed when push/pull_request events are
  # dropped or never scheduled — e.g. during an Actions incident, which leaves a
  # merged commit on main with no coverage and no way to ask for a fresh run.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  lint:
    name: Lint (make lint + golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt + go vet (make lint)
        run: make lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config .golangci.yml

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XALGORIX_REQUIRE_ORACLE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Set up application oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application oracle dependencies
        run: python -m pip install -r internal/agent/testdata/oracle-requirements.txt

      - name: go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -race -count=1

      - name: Coverage report
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 7
          if-no-files-found: warn

  platform-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/xalgorix

  macos-smoke:
    name: macOS ARM64 smoke test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify native resource metrics
        run: go test ./internal/resources -count=1

      - name: Build native binary
        run: go build ./cmd/xalgorix
